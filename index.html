<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe (with options)</title>
  <style>
    /* ===== Theme (you can change colors from JS too) ===== */
    :root{
      --page-bg-1: #ffedd5;   /* default */
      --page-bg-2: #dbeafe;
      --card: rgba(255,255,255,0.75);
      --card-border: rgba(0,0,0,0.08);

      --board-bg: rgba(255,255,255,0.6);
      --cell-bg: rgba(255,255,255,0.85);
      --cell-border: rgba(0,0,0,0.10);

      --text: #0f172a;
      --muted: rgba(15,23,42,0.65);

      --x: #2563eb;          /* X color */
      --o: #ef4444;          /* O color */
      --win: #16a34a;

      --btn: #6d28d9;
      --btn-hover: #5b21b6;
      --shadow: 0 14px 30px rgba(2,6,23,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(1200px 800px at 15% 5%, var(--page-bg-1), var(--page-bg-2));
      transition: background 250ms ease;
    }

    .app {
      width: min(860px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
    }

    @media (max-width: 860px){
      .wrap { grid-template-columns: 1fr; }
    }

    .main {
      padding: 18px;
      border-right: 1px solid rgba(0,0,0,0.06);
    }

    @media (max-width: 860px){
      .main { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.06); }
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .title {
      display: grid;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .statusBar {
      margin: 10px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.5);
      border-radius: 12px;
    }

    .statusLeft { display: grid; gap: 2px; }
    .statusLabel { color: var(--muted); font-size: 12px; }
    .statusValue { font-weight: 800; }

    .badge {
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      font-weight: 700;
      background: rgba(255,255,255,0.6);
      font-size: 12px;
      white-space: nowrap;
    }

    .boardWrap {
      display: grid;
      place-items: center;
      padding: 14px 0 8px;
    }

    .board {
      width: min(420px, 92vw);
      aspect-ratio: 1/1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
      border-radius: 18px;
      background: var(--board-bg);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .cell {
      border-radius: 14px;
      border: 1px solid var(--cell-border);
      background: var(--cell-bg);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: clamp(34px, 7vw, 70px);
      font-weight: 900;
      user-select: none;
      transition: transform 120ms ease, box-shadow 120ms ease, background 160ms ease;
      box-shadow: 0 6px 16px rgba(2,6,23,0.06);
    }

    .cell:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(2,6,23,0.10);
    }

    .cell:disabled {
      cursor: not-allowed;
      opacity: 0.9;
      transform: none;
    }

    .x { color: var(--x); text-shadow: 0 1px 0 rgba(255,255,255,0.6); }
    .o { color: var(--o); text-shadow: 0 1px 0 rgba(255,255,255,0.6); }
    .win { color: var(--win); }

    .controls {
      padding: 18px;
    }

    .controls h2{
      margin: 0 0 10px;
      font-size: 16px;
    }

    .card {
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.6);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
      align-items: center;
    }

    .row label {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    select, button, input[type="range"]{
      width: 100%;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.8);
      color: var(--text);
      outline: none;
    }

    button {
      cursor: pointer;
      font-weight: 800;
      border: none;
      background: var(--btn);
      color: white;
      transition: transform 120ms ease, background 150ms ease;
    }
    button:hover { background: var(--btn-hover); }
    button:active { transform: translateY(1px); }

    .btnRow {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .ghostBtn{
      background: rgba(109,40,217,0.12);
      color: #4c1d95;
      border: 1px solid rgba(109,40,217,0.35);
    }
    .ghostBtn:hover{
      background: rgba(109,40,217,0.18);
    }

    .scoreGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .scoreItem {
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.7);
      padding: 10px;
    }

    .scoreItem .k {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 2px;
    }

    .scoreItem .v {
      font-size: 20px;
      font-weight: 900;
    }

    .hint {
      margin: 0;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .highlightTurn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.18);
    }
    .dot.x { background: var(--x); box-shadow: 0 0 0 4px rgba(37,99,235,0.18); }
    .dot.o { background: var(--o); box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
  </style>
</head>
<body>
  <div class="app">
    <div class="wrap">
      <div class="main">
        <header>
          <div class="title">
            <h1>🎮 Tic Tac Toe</h1>
            <p class="sub">Play vs a friend or vs the computer. Choose a colorful lighter theme.</p>
          </div>
          <div class="badge" id="modeBadge">Mode: 2 Players</div>
        </header>

        <div class="statusBar">
          <div class="statusLeft">
            <div class="statusLabel">Game Status</div>
            <div class="statusValue" id="statusText">X's turn</div>
          </div>
          <div class="highlightTurn" title="Current turn indicator">
            <div class="dot x" id="turnDot"></div>
          </div>
        </div>

        <div class="boardWrap">
          <div class="board" id="board" aria-label="Tic Tac Toe board"></div>
        </div>
      </div>

      <aside class="controls">
        <h2>Options</h2>

        <div class="card">
          <div class="field">
            <label for="modeSelect">Play Mode</label>
            <select id="modeSelect">
              <option value="pvp" selected>2 Players</option>
              <option value="cpu">Play vs Computer</option>
            </select>
          </div>

          <div style="height:12px"></div>

          <div class="row">
            <div class="field">
              <label for="cpuDifficulty">CPU Difficulty</label>
              <select id="cpuDifficulty" disabled>
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard (Minimax)</option>
              </select>
            </div>
            <div class="field">
              <label for="symbolSelect">You play as</label>
              <select id="symbolSelect" disabled>
                <option value="x" selected>X</option>
                <option value="o">O</option>
              </select>
            </div>
          </div>

          <p class="hint">In CPU mode, you and the computer automatically alternate turns.</p>
        </div>

        <div class="card">
          <div class="field">
            <label for="themeSelect">Background Theme</label>
            <select id="themeSelect">
              <option value="sunrise" selected>Sunrise (light & colorful)</option>
              <option value="ocean">Ocean</option>
              <option value="spring">Spring</option>
              <option value="orchid">Orchid</option>
              <option value="candy">Candy</option>
              <option value="ember">Ember</option>
            </select>
          </div>

          <div style="height:10px"></div>

          <div class="row">
            <div class="field">
              <label for="boardOpacity">Board Lightness</label>
              <input id="boardOpacity" type="range" min="60" max="100" value="90" />
              <p class="hint" id="opacityHint" style="margin-top:0;">90%</p>
            </div>
            <div class="field">
              <label for="speedSelect">CPU Speed</label>
              <select id="speedSelect" disabled>
                <option value="fast" selected>Fast</option>
                <option value="normal">Normal</option>
                <option value="slow">Slow</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="btnRow">
            <button id="newRoundBtn" type="button">New Round</button>
            <button id="resetScoreBtn" type="button" class="ghostBtn">Reset Score</button>
          </div>

          <div class="scoreGrid">
            <div class="scoreItem">
              <div class="k" id="p1ScoreLabel">Player X</div>
              <div class="v" id="scoreX">0</div>
            </div>
            <div class="scoreItem">
              <div class="k" id="p2ScoreLabel">Player O</div>
              <div class="v" id="scoreO">0</div>
            </div>
          </div>

          <p class="hint">Ties don’t add to score. Winning cells highlight green.</p>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const modeSelect = document.getElementById('modeSelect');

    const cpuDifficultyEl = document.getElementById('cpuDifficulty');
    const symbolSelectEl = document.getElementById('symbolSelect');
    const speedSelectEl = document.getElementById('speedSelect');

    const themeSelect = document.getElementById('themeSelect');
    const boardOpacity = document.getElementById('boardOpacity');
    const opacityHint = document.getElementById('opacityHint');

    const newRoundBtn = document.getElementById('newRoundBtn');
    const resetScoreBtn = document.getElementById('resetScoreBtn');

    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');

    const turnDot = document.getElementById('turnDot');

    const LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X'; // whose turn in game logic
    let gameOver = false;

    // Score
    let score = { X: 0, O: 0 };

    // CPU settings
    function getSettings() {
      const mode = modeSelect.value; // pvp or cpu
      const difficulty = cpuDifficultyEl.value; // easy/medium/hard
      const humanSymbol = symbolSelectEl.value; // x/o
      const cpuSymbol = humanSymbol === 'x' ? 'O' : 'X';
      const speed = speedSelectEl.value; // fast/normal/slow
      return { mode, difficulty, humanSymbol, cpuSymbol, speed };
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function setTurnDot(player) {
      turnDot.classList.remove('x','o');
      turnDot.classList.add(player === 'X' ? 'x' : 'o');
    }

    function makeBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.type = 'button';
        cell.dataset.index = i;
        cell.setAttribute('aria-label', `Cell ${i+1}`);
        cell.addEventListener('click', () => handleCellClick(i));
        boardEl.appendChild(cell);
      }
    }

    function updateBoardUI() {
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach((cell, i) => {
        const val = board[i];
        cell.textContent = val ? val : '';
        cell.classList.remove('x','o','win');
        if (val === 'X') cell.classList.add('x');
        if (val === 'O') cell.classList.add('o');
        // disable if filled or game over (handled separately)
        cell.disabled = gameOver || board[i] !== null;
      });
    }

    function checkWinner(b) {
      for (const [a, c, d] of LINES) {
        const v = b[a];
        if (v && v === b[c] && v === b[d]) return { winner: v, line: [a, c, d] };
      }
      if (b.every(Boolean)) return { winner: 'TIE', line: [] };
      return null;
    }

    function highlightWin(line) {
      const cells = boardEl.querySelectorAll('.cell');
      for (const idx of line) {
        cells[idx].classList.add('win');
      }
    }

    function disableAllCells(disabled) {
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach(cell => cell.disabled = disabled || cell.textContent !== '');
    }

    function endGame(result) {
      gameOver = true;
      if (result.winner === 'TIE') {
        setStatus("It's a tie! 🎲");
        return;
      }

      // score update
      score[result.winner] += 1;
      scoreXEl.textContent = score.X;
      scoreOEl.textContent = score.O;

      setStatus(`${result.winner} wins! 🏆`);
      highlightWin(result.line);
    }

    function handleCellClick(index) {
      if (gameOver) return;
      if (board[index] !== null) return;

      const { mode, cpuSymbol } = getSettings();
      // If CPU mode and it's CPU's turn, ignore clicks
      if (mode === 'cpu' && currentPlayer === cpuSymbol) return;

      playAt(index, currentPlayer);

      const result = checkWinner(board);
      if (result) {
        endGame(result);
        return;
      }

      // Switch player
      currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
      setTurnDot(currentPlayer);
      setStatus(`${currentPlayer}'s turn`);

      // If CPU mode, let CPU play
      const updated = checkWinner(board);
      if (!updated && getSettings().mode === 'cpu') {
        maybeCpuMove();
      }
    }

    function playAt(index, player) {
      board[index] = player;
      updateBoardUI();
    }

    function availableMoves(b) {
      const moves = [];
      for (let i = 0; i < b.length; i++) if (!b[i]) moves.push(i);
      return moves;
    }

    function chooseCpuMove() {
      const { difficulty, cpuSymbol } = getSettings();

      const empty = availableMoves(board);

      // Easy: random
      if (difficulty === 'easy') {
        return empty[Math.floor(Math.random() * empty.length)];
      }

      // Medium: try win, block, else random
      if (difficulty === 'medium') {
        // 1) Win now?
        for (const m of empty) {
          const b = board.slice();
          b[m] = cpuSymbol;
          const res = checkWinner(b);
          if (res && res.winner === cpuSymbol) return m;
        }

        // 2) Block opponent win?
        const opponent = cpuSymbol === 'X' ? 'O' : 'X';
        for (const m of empty) {
          const b = board.slice();
          b[m] = opponent;
          const res = checkWinner(b);
          if (res && res.winner === opponent) return m;
        }

        // 3) Otherwise random (slightly biased to center)
        const preferred = [4, 0, 2, 6, 8, 1, 3, 5, 7].filter(i => empty.includes(i));
        return preferred[Math.floor(Math.random() * preferred.length)];
      }

      // Hard: Minimax
      if (difficulty === 'hard') {
        const opponent = cpuSymbol === 'X' ? 'O' : 'X';

        function minimax(b, isMax) {
          const res = checkWinner(b);
          if (res) {
            if (res.winner === cpuSymbol) return { score: 10 };
            if (res.winner === opponent) return { score: -10 };
            return { score: 0 }; // tie
          }

          const moves = availableMoves(b);
          let best = isMax ? { score: -Infinity, move: null } : { score: Infinity, move: null };

          for (const m of moves) {
            const next = b.slice();
            next[m] = isMax ? cpuSymbol : opponent;
            const r = minimax(next, !isMax);
            if (isMax) {
              if (r.score > best.score) best = { score: r.score, move: m };
            } else {
              if (r.score < best.score) best = { score: r.score, move: m };
            }
          }
          return best;
        }

        return minimax(board.slice(), true).move;
      }

      // fallback
      return empty[0];
    }

    function cpuDelayMs() {
      const speed = getSettings().speed;
      if (speed === 'fast') return 220;
      if (speed === 'slow') return 650;
      return 380; // normal
    }

    function maybeCpuMove() {
      if (gameOver) return;
      const { mode, cpuSymbol } = getSettings();
      if (mode !== 'cpu') return;
      if (currentPlayer !== cpuSymbol) return;

      disableAllCells(true);

      const delay = cpuDelayMs();
      setTimeout(() => {
        if (gameOver) return;
        // It's possible user made things inconsistent (but we block clicks),
        // still we'll check currentPlayer and empties.
        if (currentPlayer !== cpuSymbol) return;

        const move = chooseCpuMove();
        playAt(move, cpuSymbol);

        const result = checkWinner(board);
        if (result) {
          endGame(result);
          return;
        }

        // Switch back
        currentPlayer = (cpuSymbol === 'X') ? 'O' : 'X';
        setTurnDot(currentPlayer);
        setStatus(`${currentPlayer}'s turn`);
        updateBoardUI(); // re-enable via update logic
      }, delay);
    }

    function resetRound() {
      board = Array(9).fill(null);
      gameOver = false;
      currentPlayer = 'X';

      updateBoardUI();
      setTurnDot(currentPlayer);
      setStatus(`${currentPlayer}'s turn`);

      // In CPU mode, if CPU starts, let it move
      if (getSettings().mode === 'cpu') {
        const { cpuSymbol } = getSettings();
        if (currentPlayer === cpuSymbol) {
          maybeCpuMove();
        }
      }
    }

    function applyTheme() {
      const theme = themeSelect.value;
      // Each theme changes body background
      const themes = {
        sunrise:  ['#ffedd5', '#bfdbfe'],
        ocean:    ['#bae6fd', '#93c5fd'],
        spring:   ['#bbf7d0', '#fef9c3'],
        orchid:   ['#f5d0fe', '#a5b4fc'],
        candy:    ['#fecdd3', '#ddd6fe'],
        ember:    ['#fdba74', '#fecaca']
      };

      const [a,b] = themes[theme] || themes.sunrise;
      document.documentElement.style.setProperty('--page-bg-1', a);
      document.documentElement.style.setProperty('--page-bg-2', b);
    }

    function applyBoardOpacity() {
      const v = Number(boardOpacity.value); // 60..100
      opacityHint.textContent = `${v}%`;
      // Make cells + board more/less opaque for a lighter look
      const boardBg = `rgba(255,255,255,${v/100})`;
      const cellBg  = `rgba(255,255,255,${Math.min(1, (v+5)/100)})`;
      document.documentElement.style.setProperty('--board-bg', boardBg);
      document.documentElement.style.setProperty('--cell-bg', cellBg);
    }

    function updateControlsByMode() {
      const mode = modeSelect.value;
      if (mode === 'cpu') {
        modeBadge.textContent = 'Mode: vs Computer';
        cpuDifficultyEl.disabled = false;
        symbolSelectEl.disabled = false;
        speedSelectEl.disabled = false;

        // If human picks a symbol that changes who the CPU is, reset round
        // so turn order is consistent with a fresh start.
        resetRound();
      } else {
        modeBadge.textContent = 'Mode: 2 Players';
        cpuDifficultyEl.disabled = true;
        symbolSelectEl.disabled = true;
        speedSelectEl.disabled = true;
        resetRound();
      }
    }

    // Event listeners
    modeSelect.addEventListener('change', updateControlsByMode);
    themeSelect.addEventListener('change', applyTheme);
    boardOpacity.addEventListener('input', applyBoardOpacity);

    cpuDifficultyEl.addEventListener('change', () => { if (modeSelect.value === 'cpu') resetRound(); });
    symbolSelectEl.addEventListener('change', () => { if (modeSelect.value === 'cpu') resetRound(); });
    speedSelectEl.addEventListener('change', () => { /* speed changes affect future CPU moves only */ });

    newRoundBtn.addEventListener('click', resetRound);
    resetScoreBtn.addEventListener('click', () => {
      score = { X: 0, O: 0 };
      scoreXEl.textContent = score.X;
      scoreOEl.textContent = score.O;
      resetRound();
    });

    // Init
    makeBoard();
    applyTheme();
    applyBoardOpacity();
    updateControlsByMode();
    updateBoardUI();
  </script>
</body>
</html>
